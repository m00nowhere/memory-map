<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cecilia's Global Nomad | Memory Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&family=Inter:wght@300;400;500&display=swap');
        
        :root { 
            --bg-color: #0c0d0f; 
            --cyan-glow: #00c8ff;
            --cyan-dim: rgba(0, 200, 255, 0.2);
            --text-silver: #e2e8f0;
            --text-gray: #a0a0a0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-silver);
            overflow-x: hidden;
        }
        
        h1 { 
            font-family: 'Playfair Display', serif; 
            color: var(--text-silver);
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.15), 0 0 20px rgba(0, 200, 255, 0.05);
            background: linear-gradient(135deg, #ffffff 0%, #a2a8b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 粒子背景 Layer */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .main-container {
            position: relative;
            z-index: 10;
        }

        /* 地圖暗色調優化 */
        #map { 
            height: 75vh; 
            width: 100%; 
            border-radius: 6px; 
            border: 1px solid rgba(0, 200, 255, 0.15); 
            background: #0f1115;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 30px rgba(0, 200, 255, 0.03);
        }

        /* 讓 Dark Matter 地圖邊界透出淡淡青色線條 */
        .leaflet-tile-container {
            filter: hue-rotate(180deg) invert(92%) contrast(85%) saturate(120%) brightness(95%) multiply(#00c8ff);
            mix-blend-mode: lighten;
        }

        /* 同心圓呼吸燈 Marker */
        .dot-marker {
            width: 12px; height: 12px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-glow);
            position: relative;
        }
        .dot-marker::after {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 1px solid var(--cyan-glow);
            border-radius: 50%;
            animation: pulse 2s infinite ease-out;
            opacity: 0;
        }
        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* 玻璃態科技感切角彈窗 */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 20, 28, 0.75) !important;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(0, 200, 255, 0.25) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 200, 255, 0.05) !important;
            width: 460px !important;
            border-radius: 0px !important;
            /* 科技感不規則切角 */
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }
        .leaflet-popup-tip {
            background: rgba(15, 20, 28, 0.75) !important;
            border: 1px solid rgba(0, 200, 255, 0.25);
            backdrop-filter: blur(16px);
        }
        .leaflet-popup-content {
            margin: 0 !important;
            width: 100% !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 0;
        }

        /* 3D 卡片容器 */
        .card-container {
            position: relative;
            width: 100%;
            height: 230px;
            margin-top: 25px;
            display: flex;
            justify-content: center;
            perspective: 1000px; /* 激活 3D 空間 */
        }
        .bounce-card {
            position: absolute;
            left: 50%;
            width: 140px;
            height: 190px;
            background: #161920;
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            object-fit: cover;
            overflow: hidden;
            transform-origin: center bottom;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s, box-shadow 0.4s;
            cursor: pointer;
        }
        /* 滑鼠懸停 3D 校正與浮起 */
        .bounce-card:hover {
            transform: translate(-50%, -15px) scale(1.15) rotate(0deg) !important;
            z-index: 100 !important;
            border-color: var(--cyan-glow);
            box-shadow: 0 20px 40px rgba(0, 200, 255, 0.25), 0 0 15px var(--cyan-dim);
        }

        /* 克制的 Glitch 數字干擾動畫 */
        .glitch-effect {
            position: relative;
        }
        @keyframes glitch-anim {
            0% { clip-path: inset(40% 0 61% 0); transform: skew(0.3deg); }
            2% { clip-path: inset(92% 0 1% 0); transform: skew(-0.5deg); }
            4% { clip-path: inset(15% 0 80% 0); transform: skew(0.5deg); }
            6% { clip-path: inset(0 0 0 0); transform: skew(0deg); }
            100% { clip-path: inset(0 0 0 0); transform: skew(0deg); }
        }
        .glitch-trigger {
            animation: glitch-anim 4s infinite linear alternate-reverse;
        }
    </style>
</head>
<body class="p-6 md:px-24 lg:px-32">

    <canvas id="particle-canvas"></canvas>

    <div class="main-container">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-5xl italic glitch-effect" style="line-height: 1.2; margin-bottom: 0.5rem;">
                    Memory Map
                </h1>
                <p class="text-[9px] tracking-[0.35em] text-[#a0a0a0] uppercase font-medium">Footprints / Portfolio</p>
            </div>
            <div class="text-right text-[9px] text-[#a0a0a0] leading-relaxed uppercase tracking-widest font-mono opacity-80">
                2024-2026 Digital Archive <br> UBC & CBS Exchange
            </div>
        </header>

        <div id="map" class="shadow-2xl"></div>

        <div class="mt-5 px-1 pb-16 flex justify-between items-center text-[10px] tracking-[0.25em] text-[#8a8a8a] uppercase font-mono">
            <span class="opacity-60 flex items-center gap-2">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#00c8ff] animate-ping"></span>
                地图上每一道短暂的光阴
            </span>
            <span class="font-medium tracking-[0.4em] text-gray-400">@Cecilia</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 初始化地圖 (採用 Dark Matter 深色底圖) ---
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([30, 10], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // --- 配置區 ---
        const USERNAME = "m00nowhere"; 
        const REPO = "memory-map";
        const getImgUrl = (city, index) => `https://${USERNAME}.github.io/${REPO}/images/${city}/${index}.jpg`;

        const locations = [
            { id: 'cbs', name: "Copenhagen", coords: [55.6761, 12.5683], desc: "hygge" },
            { id: 'ubc', name: "Vancouver", coords: [49.2606, -123.2460], desc: "tiny pieces" },
            { id: 'sz', name: "Shenzhen", coords: [22.5431, 114.0579], desc: "exist" },
            { id: 'tp', name: "Taipei", coords: [25.0330, 121.5654], desc: "潮湿的记忆都被困在" },
            { id: 'hz', name: "Hangzhou", coords: [30.2741, 120.1551], desc: "曾湿西湖雨" },
            { id: 'paris', name: "Paris", coords: [48.8566, 2.3522], desc: "流动的盛宴" },
            { id: 'rome', name: "Rome", coords: [41.9028, 12.4964], desc: "片刻永恒" },
            { id: 'reyk', name: "Reykjavík", coords: [64.1265, -21.8174], desc: "Fly Me to the Moon" },
            { id: 'lofoton', name: "Lofoten", coords: [68.1214, 13.6489], desc: "我在濃霧頂端的玻璃窗" },
            { id: 'lafortuna', name: "La Fortuna", coords: [10.4709, -84.6453], desc: "Welcome to the Jungle" },
            { id: 'sapporo', name: "Sapporo", coords: [43.0618, 141.3545], desc: "First Love" },
            { id: 'banff', name: "Banff", coords: [51.1784, -115.5708], desc: "真心半解" },
            { id: 'beijing', name: "Beijing", coords: [39.9042, 116.4074], desc: "现在就是永远" },
            { id: 'amsterdam', name: "Amsterdam", coords: [52.3676, 4.9041], desc: "深秋/运河/梵高" },
            { id: 'mexicocity', name: "Mexico City", coords: [19.4326, -99.1332], desc: "二月的蓝花楹" }
        ];

        locations.forEach(loc => {
            const icon = L.divIcon({ className: 'dot-marker' });
            const marker = L.marker(loc.coords, { icon }).addTo(map);

            const popupHTML = `
                <div class="w-full font-sans">
                    <h3 class="italic text-2xl font-serif text-slate-100 text-center tracking-wide">${loc.name}</h3>
                    <p class="text-[9px] text-[#00c8ff] uppercase tracking-[0.3em] mt-2.5 mb-2 text-center opacity-90">${loc.desc}</p>
                    <div id="cards-${loc.id}" class="card-container">
                        ${[1,2,3,4].map(i => `<img src="${getImgUrl(loc.id, i)}" class="bounce-card" onerror="this.src='https://picsum.photos/400/533?grayscale'">`).join('')}
                    </div>
                </div>
            `;

            marker.bindPopup(popupHTML, { offset: [0, -5], closeButton: false });

            marker.on('popupopen', () => {
                const cards = document.querySelectorAll(`#cards-${loc.id} .bounce-card`);
                
                // 升級為帶有輕微 z 軸位移的 3D 扇形展開
                const transforms = [
                    { x: -115, r: 9,  y: 12, z: -20 }, 
                    { x: -40,  r: -3, y: 2,  z: 0   }, 
                    { x: 40,   r: 4,  y: 0,  z: 10  }, 
                    { x: 115,  r: -8, y: 14, z: -10 }
                ];

                gsap.fromTo(cards, 
                    { x: 0, xPercent: -50, y: 80, rotation: 0, opacity: 0, transformPerspective: 1000 },
                    { 
                        x: (i) => transforms[i].x, 
                        xPercent: -50,
                        y: (i) => transforms[i].y, 
                        rotation: (i) => transforms[i].r, 
                        z: (i) => transforms[i].z,
                        opacity: 1,
                        duration: 1.4, 
                        stagger: 0.08,
                        ease: "power4.out" 
                    }
                );

                // 為開啟的彈窗邊緣隨機觸發一小段 Glitch 閃爍效果
                const wrapper = document.querySelector('.leaflet-popup-content-wrapper');
                if(wrapper) {
                    wrapper.classList.add('glitch-trigger');
                    setTimeout(() => wrapper.classList.remove('glitch-trigger'), 1200);
                }
            });
        });

        // --- Canvas 暗青色微弱粒子背景動畫 ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = -Math.random() * 0.3 - 0.1; // 緩慢向上漂浮
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(0, 200, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(60, Math.floor(window.innerWidth / 20));
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
